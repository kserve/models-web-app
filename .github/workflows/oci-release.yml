name: Models Web Application OCI Container Publisher

on:
  push:
    # Publish `master` as `latest` OCI image.
    branches:
    - master
    - v*
    # Publish `v1.2.3` tags as releases.
    tags:
    - v*
  # Run tests for any PRs.
  pull_request:
env:
  PLATFORMS: linux/ppc64le,linux/amd64,linux/arm64
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Run tests
      run: |
        make docker-build
        make docker-smoke-test
  push:
    needs: test
    runs-on: ubuntu-latest
    # Only run on push events, not PRs
    if: github.event_name == 'push'
    permissions:
      packages: write
      contents: read
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        platforms: amd64,ppc64le,arm64
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Log into GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract metadata (tags, labels) for OCI image
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=schedule
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=sha
          # Add 'latest' tag for master branch pushes
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
    - name: Select application version
      id: version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          # For tag builds: use the clean tag version
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
        else
          VERSION=$(node -p "require('./frontend/package.json').version")
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    - name: Build and push multi-architecture OCI image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ./Dockerfile
        platforms: ${{ env.PLATFORMS }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VERSION=${{ steps.version.outputs.version }}

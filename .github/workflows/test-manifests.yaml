name: Test KServe Models Web Application
on:
  pull_request:
    paths:
      - .github/workflows/test-manifests.yaml
      - manifests/kustomize/**
      - backend/**
      - frontend/**
      - common/**
      - Dockerfile
      - .dockerignore
      - Makefile

permissions:
  contents: read
  actions: read

env:
  KF_PROFILE: kubeflow-user-example-com
  IMG: ghcr.io/kserve/models-web-app
  TAG: pull-request-${{ github.event.pull_request.number }}-${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout kserve/models-web-app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Kubeflow Community Distribution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kubeflow/community-distribution
          path: kubeflow-manifests

      - name: Install KinD, Create KinD cluster and Install kustomize
        run: ./kubeflow-manifests/tests/install_KinD_create_KinD_cluster_install_kustomize.sh

      - name: Build and smoke-test pull request image
        run: |
          make docker-build
          make docker-smoke-test

      - name: Load pull request image into KinD
        run: kind load docker-image "${IMG}:${TAG}" --name "$(kind get clusters)"

      - name: Validate Community Distribution KServe manifests
        working-directory: kubeflow-manifests
        run: |
          pip3 install -q PyYAML
          python3 tests/kserve_manifest_test.py

      - name: Create Kubeflow Namespace
        working-directory: kubeflow-manifests
        run: kustomize build common/kubeflow-namespace/base | kubectl apply -f -

      - name: Install Istio CNI
        working-directory: kubeflow-manifests
        run: ./tests/istio-cni_install.sh

      - name: Install OAuth2 Proxy
        working-directory: kubeflow-manifests
        run: ./tests/oauth2-proxy_install.sh

      - name: Install Certificate Manager
        working-directory: kubeflow-manifests
        run: ./tests/cert_manager_install.sh

      - name: Install Knative Serving
        working-directory: kubeflow-manifests
        run: ./tests/knative_serving_install.sh

      - name: Prepare pull request manifests and image
        run: |
          configuration_directory=$(mktemp -d)
          trap 'rm -rf "${configuration_directory}"' EXIT
          cd "${configuration_directory}"
          resources=$(realpath --relative-to="${configuration_directory}" "${GITHUB_WORKSPACE}/manifests/kustomize/overlays/kubeflow")
          kustomize create --resources "${resources}"
          kustomize edit set namespace kserve
          kustomize edit set image "ghcr.io/kserve/models-web-app=${IMG}:${TAG}"
          kustomize edit add patch --kind Deployment --name kserve-models-web-application \
            --patch '[{"op":"replace","path":"/spec/template/spec/containers/0/imagePullPolicy","value":"Never"}]'
          kustomize edit add patch --kind VirtualService \
            --patch '[{"op":"replace","path":"/spec/http/0/route/0/destination/host","value":"kserve-models-web-application.kserve.svc.cluster.local"}]'
          application_directory="${GITHUB_WORKSPACE}/kubeflow-manifests/applications/kserve/kserve-ui"
          kustomize build . > "${application_directory}/pull-request.yaml"
          cd "${application_directory}"
          rm kustomization.yaml
          kustomize create --resources pull-request.yaml

      - name: Install KServe and pull request application
        working-directory: kubeflow-manifests
        run: ./tests/kserve_install.sh

      - name: Install Profile Controller
        working-directory: kubeflow-manifests
        run: ./tests/profile_controller_install.sh

      - name: Install Multi-Tenancy
        working-directory: kubeflow-manifests
        run: ./tests/multi_tenancy_install.sh

      - name: Install Kubeflow Istio Resources
        working-directory: kubeflow-manifests
        run: kustomize build common/istio/kubeflow-istio-resources/base | kubectl apply -f -

      - name: Create KF Profile
        working-directory: kubeflow-manifests
        run: ./tests/kubeflow_profile_install.sh

      - name: Setup python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12

      - name: Port-forward the istio-ingress gateway
        working-directory: kubeflow-manifests
        run: ./tests/port_forward_gateway.sh

      - name: Wait for Istio configurations to propagate
        run: |
          kubectl wait --for=condition=Available --timeout=120s \
            deployment/cluster-local-gateway -n istio-system
          sleep 60

      - name: Run KServe tests
        working-directory: kubeflow-manifests
        run: ./tests/kserve_test.sh "${KF_PROFILE}"

      - name: Apply Pod Security Standards
        working-directory: kubeflow-manifests
        run: ./tests/PSS_enable.sh

      - name: Collect Logs on Failure
        if: failure() || cancelled()
        timeout-minutes: 5
        run: |
          mkdir -p logs
          kubectl get all --all-namespaces > logs/resources.txt
          kubectl get events --all-namespaces \
            --sort-by=.metadata.creationTimestamp > logs/events.txt
          for namespace in kubeflow kserve kubeflow-system istio-system cert-manager auth kubeflow-user-example-com; do
            kubectl get namespace "$namespace" >/dev/null 2>&1 || continue
            kubectl describe pods -n "$namespace" > "logs/$namespace-pods.txt"
            for pod in $(kubectl get pods -n "$namespace" \
                -o jsonpath='{.items[*].metadata.name}'); do
              kubectl logs -n "$namespace" "$pod" --tail=100 \
                > "logs/$namespace-$pod.txt" 2>&1 || true
            done
          done

      - name: Upload Diagnostic Logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kserve-models-web-app-test-logs
          path: logs/
